<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Join a Convoy ride</title>
<!--
  Where a Convoy invite links to (lib/inviteLink.js): /join/?code=K7P2QX.
  Shows the ride code with a copy button. The app can't be opened straight
  from a link without a new native build, so the code travels by clipboard —
  the app's Join sheet fills it in from there. Nothing is fetched or stored;
  the code never leaves this page.

  Hosted from the convoy-site repo (GitHub Pages), alongside /live.
-->
<style>
  :root {
    --bg: #f4f4f6; --card: #ffffff; --text: #0f0f14; --muted: #6b6b70; --border: #e0e0e6; --ok: #4a8f68;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f14; --card: #151519; --text: #ffffff; --muted: #9a9aa0; --border: #2a2a34; --ok: #6fb98c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 22px 20px; box-shadow: 0 6px 20px rgba(0,0,0,.12); text-align: center;
  }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
  h1 { font-size: 20px; margin: 6px 0 14px; }
  .code {
    font: 800 34px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 6px;
    padding: 16px 8px 16px 14px; border: 1px dashed var(--border); border-radius: 14px;
    user-select: all; -webkit-user-select: all; word-break: break-all;
  }
  /* The app's own primary button: solid text colour, background-coloured label. */
  button {
    margin-top: 14px; width: 100%; border: 0; border-radius: 14px; padding: 15px;
    background: var(--text); color: var(--bg); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button.done { background: var(--ok); color: #fff; }
  ol { text-align: left; color: var(--muted); padding-left: 20px; margin: 18px 0 0; }
  ol li { margin: 6px 0; }
  ol b { color: var(--text); }
  .error h1 { margin-bottom: 6px; }
  .error p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand">Convoy</div>
  <h1>You're invited to a ride</h1>
  <div class="code" id="code" aria-label="Ride code"></div>
  <button id="copy" type="button">Copy code</button>
  <ol>
    <li>Tap <b>Copy code</b> above.</li>
    <li>Open <b>Convoy</b> and tap <b>Join a Ride</b>.</li>
    <li>The code fills itself in — just tap <b>Continue</b>.</li>
  </ol>
</main>

<script>
(function () {
  var code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
  var card = document.getElementById('card');

  if (!/^[A-Z0-9]{5,6}$/.test(code)) {
    card.className = 'card error';
    card.innerHTML = '';
    var h = document.createElement('h1'); h.textContent = "This invite link isn't complete";
    var p = document.createElement('p'); p.textContent = 'Ask whoever sent it for the ride code — it’s in their message too.';
    card.appendChild(h); card.appendChild(p);
    return;
  }

  document.getElementById('code').textContent = code;
  var button = document.getElementById('copy');

  function copied() {
    button.textContent = 'Copied — now open Convoy';
    button.className = 'done';
  }

  button.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(copied, fallback);
    } else {
      fallback();
    }
  });

  // Older browsers: select the code so a long-press copies it.
  function fallback() {
    var range = document.createRange();
    range.selectNodeContents(document.getElementById('code'));
    var selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    try { if (document.execCommand('copy')) { copied(); return; } } catch (e) { /* fall through */ }
    button.textContent = 'Long-press the code to copy it';
  }
})();
</script>
</body>
</html>
